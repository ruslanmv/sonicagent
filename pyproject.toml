[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sonicagent-rt"
version = "0.0.0.dev0"
description = "Real-time voice-agent gateway"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "SonicAgent contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "structlog>=24.1,<27",
  "prometheus-client>=0.20,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<8",
  "mypy>=1.10,<3",
  "ruff>=0.5,<1",
  "jsonschema>=4.23,<5",
  "mkdocs>=1.6,<2",
]
models = [
  "onnxruntime>=1.18,<2",
  "faster-whisper>=1.2.1,<1.3",
  "numpy>=1.26,<3",
  "av>=13,<20",
  "piper-tts==1.8.0",
]
otel = [
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp>=1.25,<2",
]

[project.scripts]
sonicagent-rt = "sonicagent_rt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: integration tests", "e2e: end-to-end tests", "performance: performance tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Keep the historical Ruff default. Newer Ruff releases enable import-sorting
# and bugbear rules that the existing scaffold does not follow.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sonicagent_rt"]
