name: Web client
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install
        working-directory: clients/web
      - run: npm test
        working-directory: clients/web
      - run: npm run build
        working-directory: clients/web
