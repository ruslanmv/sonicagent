name: Sync to Hugging Face Space

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  sync-to-hub:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: hf-space-sync-canonical
      cancel-in-progress: false
    env:
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      SPACE_NAME: ${{ secrets.SPACE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy tree and push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_USERNAME}" ] || [ -z "${SPACE_NAME}" ]; then
            echo "Missing HF_USERNAME or SPACE_NAME repository secret."
            exit 1
          fi
          if [ -z "${HF_TOKEN}" ]; then
            echo "Missing HF_TOKEN secret."
            exit 1
          fi

          DEPLOY_DIR="$(mktemp -d)"
          python3 hf/scripts/prepare-space.py --dest "$DEPLOY_DIR"

          cd "$DEPLOY_DIR"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy from ${GITHUB_SHA}"
          git config credential.helper '!f() { echo "username=${HF_USERNAME}"; echo "password=${HF_TOKEN}"; }; f'
          git push --force "https://huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}" HEAD:main
          echo "Sync complete for ${HF_USERNAME}/${SPACE_NAME}."
