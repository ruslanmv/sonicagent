name: Sync to Hugging Face Space

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  sync-to-hub:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: hf-space-sync-canonical
      cancel-in-progress: false
    env:
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      SPACE_NAME: ${{ secrets.SPACE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugging Face upload client
        run: pip install -U "huggingface_hub>=1.1" "hf-xet"

      - name: Build deploy tree and upload to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_USERNAME}" ] || [ -z "${SPACE_NAME}" ]; then
            echo "Missing HF_USERNAME or SPACE_NAME repository secret."
            exit 1
          fi
          if [ -z "${HF_TOKEN}" ]; then
            echo "Missing HF_TOKEN secret."
            exit 1
          fi
          DEPLOY_DIR="$(mktemp -d)"
          python3 hf/scripts/prepare-space.py --dest "$DEPLOY_DIR"
          python3 hf/scripts/upload-space.py --dest "$DEPLOY_DIR"
          echo "Sync complete for ${HF_USERNAME}/${SPACE_NAME}."
