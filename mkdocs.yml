site_name: SonicAgent-RT
site_description: Simple documentation for the SonicAgent-RT real-time voice-agent gateway
site_url: https://example.com/sonicagent-rt/
repo_name: sonicagent-rt
repo_url: https://github.com/your-org/sonicagent-rt

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - bash
    - json
    - python

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list

nav:
  - Home: index.md
  - Simple start:
      - What this app does: user-guide/what-is-sonicagent.md
      - Install and run: user-guide/install-and-run.md
      - Use the browser demo: user-guide/browser-demo.md
      - Troubleshooting basics: troubleshooting.md
  - Operators:
      - Configuration: configuration.md
      - Security and privacy: security.md
      - Production status: production-status.md
      - Deployment: deployment.md
      - Speech recognition: speech-recognition.md
      - OllaBridge voice: integrations/ollabridge-huggingface-voice.md
      - Observability: observability.md
  - Developers:
      - Architecture: architecture.md
      - Protocol overview: protocol.md
      - Binary audio frame: api/binary-frame.md
      - REST API: api/rest-api.md
      - Errors: api/errors.md
      - WebSocket events: api/websocket-events.md
      - Speech-only stream: api/speech-stream.md
      - Model registry: model-registry.md
      - Roadmap: roadmap.md
